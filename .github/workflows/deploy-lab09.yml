name: Deploy Lab 9 and Project to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "labs/lab09/**"
      - "project/**"
      - ".github/workflows/deploy-lab09.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          mkdir -p _site/project
          cp -R labs/lab09/. _site/
          cp -R project/. _site/project/
          touch _site/.nojekyll

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
